name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK with tag
        id: rename
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk "release-out/wf-thermos-eye-${TAG}.apk"
          echo "apk_path=release-out/wf-thermos-eye-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: hash
        run: |
          SHA=$(sha256sum "${{ steps.rename.outputs.apk_path }}" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename.outputs.tag }}
          name: ${{ steps.rename.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## wf-thermos-eye ${{ steps.rename.outputs.tag }}

            **Debug-signed APK** — install on your own device (Android 14+).

            - SHA256: `${{ steps.hash.outputs.sha256 }}`
            - minSdk: 34 (Android 14)
            - targetSdk: 35 (Android 15)
            - Built from commit: `${{ github.sha }}`

            ### Install
            1. Download `wf-thermos-eye-${{ steps.rename.outputs.tag }}.apk` below.
            2. Open on Android 14+ device.
            3. Enable "Install unknown apps" for the source app.
            4. Tap to install.
          files: ${{ steps.rename.outputs.apk_path }}
